# SchemaSpy Configuration
# See https://schemaspy.readthedocs.io/en/latest/configuration.html
#
# These defaults are used when no command-line arguments are supplied.
# The run-schemaspy.sh script and the CI workflow always pass explicit
# -host / -port / -db / -u / -p flags that override these values.

# Database type (pgsql, mysql, mssql, ora, etc.)
schemaspy.t=pgsql

# Database host (overridden via CLI in run-schemaspy.sh and CI)
schemaspy.host=localhost

# Database port
schemaspy.port=5432

# Database name
schemaspy.db=schemaspy

# Schema to document (comment out to document all schemas)
# schemaspy.s=public

# Database credentials
schemaspy.u=schemaspy
schemaspy.p=schemaspy

# Output directory (inside the container)
schemaspy.o=/output

# Number of threads used for diagram generation
schemaspy.degree=2

# Include views in the documentation
schemaspy.views=true

# Uncomment to enable verbose debug logging
# schemaspy.debug=true
